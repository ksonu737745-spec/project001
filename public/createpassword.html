<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Password</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b,#334155);
}

.container{
    width:350px;
    background:#fff;
    padding:30px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

.container h2{
    text-align:center;
    color:#0f172a;
    margin-bottom:10px;
}

.container p{
    text-align:center;
    color:#666;
    font-size:14px;
    margin-bottom:25px;
}

.input-box{
    margin-bottom:18px;
}

.input-box label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
    color:#333;
}

.input-box input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    outline:none;
    font-size:15px;
}

.input-box input:focus{
    border-color:#2563eb;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:#fff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#1d4ed8;
}
</style>

</head>
<body>

<div class="container">

    <h2>Create Password</h2>
    <p>Create a strong password for your account.</p>

    <form action="/createpassword" method="POST">

        <div class="input-box">
            <label>New Password</label>
            <input type="password" name="password" placeholder="Enter Password" required>
        </div>

        <div class="input-box">
            <label>Confirm Password</label>
            <input type="password" name="confirmPassword" placeholder="Confirm Password" required>
        </div>

        <button type="submit">Create Password</button>

    </form>

</div>

<script>

// Keyboard Scroll Fix


document.querySelectorAll("input").forEach(function(input){


input.addEventListener("focus",function(){


setTimeout(function(){


input.scrollIntoView({

behavior:"smooth",

block:"center"

});


},300);


});


});
</script>

</body>
</html>
