<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Created</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b,#334155);
}

.card{
    width:360px;
    background:#fff;
    padding:35px 25px;
    border-radius:18px;
    text-align:center;
    box-shadow:0 15px 35px rgba(0,0,0,.25);
}

.icon{
    width:90px;
    height:90px;
    margin:auto;
    border-radius:50%;
    background:#22c55e;
    color:#fff;
    font-size:48px;
    display:flex;
    justify-content:center;
    align-items:center;
}

h2{
    margin:20px 0 10px;
    color:#111827;
}

p{
    color:#6b7280;
    line-height:1.6;
    margin-bottom:25px;
}

a{
    display:block;
    text-decoration:none;
    background:#2563eb;
    color:#fff;
    padding:13px;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    transition:.3s;
}

a:hover{
    background:#1d4ed8;
}
</style>
</head>
<body>

<div class="card">

    <div class="icon">✓</div>

    <h2>Password Created!</h2>

    <p>
        Your password has been created successfully.
        You can now log in to your account.
    </p>

    <a href="login.html">Go to Login</a>

</div>

</body>
</html>
