<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Card</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f6f9;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.email-card{
    background:#fff;
    padding:20px;
    border-radius:12px;
    box-shadow:0 8px 20px rgba(0,0,0,.12);
    width:340px;
    text-align:center;
}

.email-card h3{
    color:#333;
    margin-bottom:12px;
}

.email{
    background:#eef3ff;
    color:#1565c0;
    padding:12px;
    border-radius:8px;
    font-size:16px;
    font-weight:600;
    word-break:break-all;
}
</style>
</head>
<body>

<div class="email-card">
    <h3>Email Address</h3>
    <div class="email">
        ksonu737876745@gmail.com
    </div>
</div>

</body>
</html>
