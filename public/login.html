<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RK Services Login</title>

<link rel="stylesheet" href="login.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>


<body>


<div class="register-box">


<div class="profile">


<div class="profile-img">

<i class="fa-solid fa-right-to-bracket"></i>

</div>


<h2>RK Services</h2>


<p>Login Your Account</p>


</div>




<form id="loginForm" action="/login" method="post">



<div class="input-box">

<i class="fa-solid fa-envelope"></i>

<input type="email" placeholder="Email Address" name="email" required>

</div>





<div class="input-box">


<i class="fa-solid fa-lock"></i>


<input type="password" id="password" placeholder="Password" name="password" required>


<i class="fa-solid fa-eye eye" id="eye"></i>


</div>





<button type="submit">

Login

</button>



</form>





<p style="text-align:center;margin-top:20px;">

Don't have account?

<a href="registration.html" style="color:#2563eb;text-decoration:none;font-weight:bold;">
Sign Up
</a>
</p>
<p style="text-align:center;margin-top:20px;">
<a href="sendotp.html" style="color:#2563eb;text-decoration:none;font-weight:bold;">
Forget password?
</a>
</p>







</div>




<script>


// Password Show Hide


const password=document.getElementById("password");

const eye=document.getElementById("eye");



eye.onclick=function(){


if(password.type==="password"){


password.type="text";


eye.classList.remove("fa-eye");

eye.classList.add("fa-eye-slash");



}else{


password.type="password";


eye.classList.remove("fa-eye-slash");

eye.classList.add("fa-eye");


}


};





// Keyboard Scroll Fix


document.querySelectorAll("input").forEach(function(input){


input.addEventListener("focus",function(){


setTimeout(function(){


input.scrollIntoView({

behavior:"smooth",

block:"center"

});


},300);


});


});






</script>


</body>

</html>
