<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f4f7fb;
}

.login{
    width:90%;
    max-width:380px;
    background:white;
    padding:25px;
    border-radius:16px;
    box-shadow:0 8px 30px #0002;
    border-top:5px solid #2563eb;
}

h2{
    text-align:center;
    color:#172033;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:12px;
    border:1px solid #d9e0ea;
    border-radius:8px;
    outline:none;
}

input:focus{
    border-color:#2563eb;
}

button{
    width:100%;
    padding:12px;
    border:0;
    border-radius:8px;
    background:#2563eb;
    color:white;
    font-size:15px;
    cursor:pointer;
}

#error{
    color:#dc2626;
    text-align:center;
    font-size:13px;
    margin-top:12px;
}
</style>
</head>

<body>

<div class="login">

    <h2>Admin Login</h2>

    <form action="/admin-login" method="POST">

        <input
            type="text"
            name="userId"
            placeholder="Admin User ID"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit" onclick="adminLogin()">
            Login
        </button>

    </form>

    <p id="error"></p>

</div>

</body>
</html>


<script>
async function adminLogin() {

    const userId = document.getElementById("userId").value;
    const password = document.getElementById("password").value;

    const response = await fetch("/admin-login", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            userId,
            password
        })
    });

    if (response.redirected) {
        location.href = response.url;
        return;
    }

    const result = await response.text();
    alert(result);
}
</script>
