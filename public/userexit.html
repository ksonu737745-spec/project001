<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Already Exists</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f5f7fb;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    padding:20px;
}

.box{
    width:100%;
    max-width:420px;
    background:#fff;
    border-radius:20px;
    padding:35px 30px;
    text-align:center;
    box-shadow:0 12px 30px rgba(0,0,0,.12);
    border-top:6px solid #2563eb;
}

.icon{
    width:90px;
    height:90px;
    margin:auto;
    margin-bottom:20px;
    border-radius:50%;
    background:#2563eb;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:45px;
    font-weight:bold;
}

h2{
    color:#1f2937;
    font-size:30px;
    margin-bottom:15px;
}

p{
    color:#6b7280;
    font-size:16px;
    line-height:28px;
    margin-bottom:30px;
}

.login-btn{
    display:block;
    width:100%;
    padding:15px;
    background:#2563eb;
    color:#fff;
    text-decoration:none;
    font-size:18px;
    font-weight:bold;
    border-radius:12px;
    transition:.3s;
}

.login-btn:hover{
    background:#1d4ed8;
    transform:translateY(-2px);
}
</style>

</head>
<body>

<div class="box">

    <div class="icon">!</div>

    <h2>User Already Exists</h2>

    <p>
        This account is already registered.<br>
        Please login to continue.
    </p>

    <a href="login.html" class="login-btn">
        Login
    </a>

</div>

</body>
</html>
